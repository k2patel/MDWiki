<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Publish · {{SITE_NAME}}</title>
    <style>
      :root { font-family: Inter, "Segoe UI", system-ui, sans-serif; color-scheme: light dark; --ink:#142033; --muted:#526176; --surface:#fff; --canvas:#f4f7fb; --border:#d5dfeb; --accent:#075f80; --signal:#b34e0a }
      @media (prefers-color-scheme:dark) { :root { --ink:#e8eff7; --muted:#a8b6c8; --surface:#0e1a2b; --canvas:#08111f; --border:#263a54; --accent:#63cbe8; --signal:#ffae62 } }
      * { box-sizing:border-box } body { margin:0; min-height:100vh; background:var(--canvas); color:var(--ink) } main { width:min(52rem,calc(100% - 2rem)); margin:4rem auto } header { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; border-bottom:1px solid var(--border); padding-bottom:1.25rem } h1 { margin:0; font-size:clamp(2rem,6vw,4rem); letter-spacing:-.06em } header a { color:var(--accent) } .lede { color:var(--muted); max-width:45rem; line-height:1.65 } form { margin-top:2rem; padding:clamp(1rem,4vw,2rem); background:var(--surface); border:1px solid var(--border); border-radius:1rem } label { display:block; margin:1rem 0 .4rem; font-weight:700 } input,textarea,button { width:100%; font:inherit; border-radius:.45rem } input,textarea { border:1px solid var(--border); background:var(--canvas); color:var(--ink); padding:.8rem } textarea { min-height:20rem; resize:vertical; font-family:"Cascadia Code",ui-monospace,monospace; line-height:1.5 } input:focus,textarea:focus { outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent); border-color:var(--accent) } .row { display:grid; grid-template-columns:1fr 1fr; gap:1rem } button { margin-top:1.25rem; border:0; padding:.9rem; background:var(--accent); color:var(--surface); font-weight:800; cursor:pointer } #status { min-height:1.5rem; color:var(--muted) } @media(max-width:38rem){main{margin:1.5rem auto}.row{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <main>
      <header><h1>Publish.</h1><a href="/">Back to {{SITE_NAME}}</a></header>
      <p class="lede">Create a Markdown page or choose an existing <code>.md</code> file. Publishing writes to the configured content volume and refreshes search and topic indexes.</p>
      <form id="publish-form">
        <div class="row">
          <div><label for="path">Page path</label><input id="path" name="path" placeholder="runbooks/database.md" required></div>
          <div><label for="file">Load Markdown file</label><input id="file" type="file" accept=".md,text/markdown,text/plain"></div>
        </div>
        <label for="content">Markdown</label>
        <textarea id="content" name="content" placeholder="# Page title" required></textarea>
        <button type="submit">Publish page</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script>
      const form=document.querySelector("#publish-form"),file=document.querySelector("#file"),path=document.querySelector("#path"),content=document.querySelector("#content"),status=document.querySelector("#status");
      file.addEventListener("change",async()=>{const selected=file.files[0];if(!selected)return;content.value=await selected.text();if(!path.value)path.value=selected.name});
      form.addEventListener("submit",async(event)=>{event.preventDefault();status.textContent="Publishing and rebuilding…";const response=await fetch("/api/pages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:path.value,content:content.value})});if(response.ok){const result=await response.json();status.innerHTML=`Published. <a href="${result.url}">Open page</a>`}else{status.textContent=`Publish failed: ${response.status} ${response.statusText}`}});
    </script>
  </body>
</html>
