apiVersion: v1
kind: Service
metadata:
  name: {{ include "mdwiki.fullname" . }}
  labels:
    {{- include "mdwiki.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  {{- if and .Values.service.externalTrafficPolicy (or (eq .Values.service.type "LoadBalancer") (eq .Values.service.type "NodePort")) }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "mdwiki.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
